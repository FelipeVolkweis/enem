sql: "-- National vs S\xE3o Carlos (schools in S\xE3o Carlos-SP, IBGE 3548906) rows\
  \ of the school aggregate.\n-- Combine rows with the `media` metric: sum(soma_notas)\
  \ / sum(qt_participantes).\nselect 'Brasil' as recorte, ano, ordem_area, co_area,\
  \ no_area, qt_participantes, soma_notas\nfrom iceberg.marts.agg_desempenho_enem_escola\n\
  union all\nselect 'S\xE3o Carlos' as recorte, ano, ordem_area, co_area, no_area,\
  \ qt_participantes, soma_notas\nfrom iceberg.marts.agg_desempenho_enem_escola\n\
  where co_municipio = 3548906"
