sql: "-- One row per S\xE3o Carlos-SP school (IBGE 3548906) and ENEM edition, its\
  \ averages per area.\n-- qt_participantes counts participants present on both days\
  \ (those in media_geral). posicao ranks the schools\n-- with at least 5 of them\
  \ by media_geral (1 = best), posicao_inversa the other way (1 = worst).\nwith escolas\
  \ as (\nselect\n    ano,\n    co_escola,\n    if(no_escola = 'N\xC3O INFORMADO',\
  \ 'Escola INEP ' || cast(co_escola as varchar), no_escola) as no_escola,\n    no_dependencia_adm,\n\
  \    coalesce(max(if(co_area = 'media_geral', qt_participantes)), 0) as qt_participantes,\n\
  \    max(if(co_area = 'media_geral', media_nota)) as media_geral,\n    max(if(co_area\
  \ = 'cn', media_nota)) as media_cn,\n    max(if(co_area = 'ch', media_nota)) as\
  \ media_ch,\n    max(if(co_area = 'lc', media_nota)) as media_lc,\n    max(if(co_area\
  \ = 'mt', media_nota)) as media_mt,\n    max(if(co_area = 'redacao', media_nota))\
  \ as media_redacao\nfrom iceberg.marts.agg_desempenho_enem_escola\nwhere co_municipio\
  \ = 3548906\ngroup by 1, 2, 3, 4\n)\n\nselect\n    *,\n    if(qt_participantes >=\
  \ 5, rank() over (partition by ano, qt_participantes >= 5 order by media_geral desc))\n\
  \        as posicao,\n    if(qt_participantes >= 5, rank() over (partition by ano,\
  \ qt_participantes >= 5 order by media_geral asc))\n        as posicao_inversa\n\
  from escolas"
