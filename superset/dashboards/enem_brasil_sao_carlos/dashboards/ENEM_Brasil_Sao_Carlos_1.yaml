    meta:
      width: 12
      height: 24
      code: '### ENEM — Brasil × São Carlos


        Média dos participantes **presentes** em cada prova (ausentes e eliminados
        ficam de fora). A *média geral* é a média

        simples das cinco notas (CN, CH, LC, MT e Redação) de quem fez os dois dias.
        **São Carlos** são os participantes de

        escolas de São Carlos-SP (IBGE 3548906); quem não informou a escola só entra
        no Brasil. Em 2019 poucos participantes

        informaram a escola, por isso a amostra de São Carlos é pequena nesse ano.


        Melhor e pior escola: só escolas com pelo menos **5** participantes presentes
        nos dois dias, para que um único

        aluno não decida o ranking. Fonte: `iceberg.marts.agg_desempenho_enem_escola`.'
