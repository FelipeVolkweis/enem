version: 2

models:
  - name: enem_participantes
    description: >
      ENEM 2019 and 2024 microdata, one row per participant, typed and cleaned from bronze.
      Blanks become NULL, float-formatted codes ("42.0") become integers, and 2019 municipality names
      that were double-encoded ("SÃ£o Carlos") are repaired. 18 rows of 2019 were truncated by the
      per-state join (a cell ending in ";UF" with nothing after it); that cell is set to NULL. q001..q025 hold the answer letters as given;
      their meaning depends on the year, so decode them with dicionario_questionario on (nu_ano, questao).
    columns:
      - name: nu_inscricao
        description: Registration number; the 2019 and 2024 ranges do not overlap.
        data_tests: [unique, not_null]
      - name: nu_ano
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [2019, 2024], quote: false}
      - name: tp_sexo
        data_tests:
          - accepted_values:
              arguments: {values: ['M', 'F']}
      - name: co_escola
        description: INEP school code; joins to censo_escolar.co_entidade. NULL for most participants.
      - name: q024
        description: Only asked in 2019 (has a computer); NULL for 2024.
      - name: q025
        description: Only asked in 2019 (has internet access); NULL for 2024.

  - name: dicionario_questionario
    description: Socioeconomic questionnaire questions and answer options, per ENEM edition.
    data_tests:
      - unique:
          column_name: "cast(nu_ano as varchar) || '|' || questao || '|' || alternativa"
    columns:
      - name: nu_ano
        data_tests: [not_null]
      - name: questao
        description: Lowercase q-code matching the enem_participantes column (q001..q025).
        data_tests: [not_null]
      - name: alternativa
        data_tests: [not_null]

  - name: censo_escolar
    description: >
      Censo Escolar (educação básica) 2019 and 2024, one row per school per year. Columns from both
      layouts are kept (NULL where a year lacks them) and typed by INEP prefix: co_/in_/tp_/qt_ integer,
      dt_ date, the rest varchar; CEP, CNPJ, phone and street number stay text.
    data_tests:
      - unique:
          column_name: "cast(nu_ano_censo as varchar) || '|' || cast(co_entidade as varchar)"
    columns:
      - name: nu_ano_censo
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [2019, 2024], quote: false}
      - name: co_entidade
        description: INEP school code (matches enem_participantes.co_escola).
        data_tests: [not_null]
