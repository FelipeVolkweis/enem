name: enem
version: "1.0.0"
profile: enem

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  enem:
    # Typed, cleaned bronze sources (the medallion "silver" layer), in iceberg.staging.
    # Tables rather than views: the cleanup is too heavy to repeat on every downstream read.
    staging:
      +schema: staging
      +materialized: table
    # dbt_smoke_test fixtures, kept apart from the ENEM data (schema enem_dw).
    smoke:
      +materialized: view
      +tags: [smoke]

seeds:
  enem:
    smoke:
      +tags: [smoke]
