services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: enem-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: enem-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - lakehouse-net
    entrypoint: ["/usr/bin/bash", "-c"]
    command:
      - |
        until mc alias set localminio http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          echo "Waiting for MinIO connection..."
          sleep 1
        done
        mc mb --ignore-existing localminio/"$${WAREHOUSE_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      WAREHOUSE_BUCKET: ${WAREHOUSE_BUCKET}

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    container_name: enem-iceberg-rest
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: ${ICEBERG_WAREHOUSE_LOCATION}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:sqlite:/catalog/iceberg_catalog.db
      CATALOG_JDBC_USER: user
      CATALOG_JDBC_PASSWORD: password
      CATALOG_CLIENTS: "1"  # SQLite allows a single writer
    ports:
      - "${ICEBERG_REST_PORT}:8181"
    volumes:
      - iceberg_data:/catalog
    networks:
      - lakehouse-net
    depends_on:
      minio-init:
        condition: service_completed_successfully

  trino:
    image: trinodb/trino:483
    container_name: enem-trino
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${TRINO_PORT}:8080"
    volumes:
      - ./trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      iceberg-rest:
        condition: service_started

  airflow:
    build: ./airflow
    image: enem-airflow:3.3.2
    pull_policy: build
    container_name: enem-airflow
    command: standalone
    restart: unless-stopped
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "120"
      # Local dev only: every visitor is an admin, no login screen.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      # Bronze ingestion: MinIO landing area + Iceberg REST catalog.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      WAREHOUSE_BUCKET: ${WAREHOUSE_BUCKET}
      ICEBERG_REST_URI: http://iceberg-rest:8181
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
    networks:
      - lakehouse-net
    depends_on:
      trino:
        condition: service_healthy

volumes:
  minio_data:
  iceberg_data:

networks:
  lakehouse-net:
    driver: bridge
