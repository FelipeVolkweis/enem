services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: enem-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: enem-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - lakehouse-net
    entrypoint: ["/usr/bin/bash", "-c"]
    command:
      - |
        echo "Configuring MinIO client..."
        until mc alias set localminio http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          echo "Waiting for MinIO connection..."
          sleep 1
        done
        mc mb --ignore-existing localminio/"$${WAREHOUSE_BUCKET}"
        echo "Bucket $${WAREHOUSE_BUCKET} ready!"
        exit 0
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      WAREHOUSE_BUCKET: ${WAREHOUSE_BUCKET}

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: enem-iceberg-rest
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: ${ICEBERG_WAREHOUSE_LOCATION}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "${ICEBERG_REST_PORT}:8181"
    networks:
      - lakehouse-net
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  minio_data:

networks:
  lakehouse-net:
    driver: bridge
