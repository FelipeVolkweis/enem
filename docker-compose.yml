services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: enem-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: enem-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - lakehouse-net
    entrypoint: ["/usr/bin/bash", "-c"]
    command:
      - |
        echo "Configuring MinIO client..."
        until mc alias set localminio http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          echo "Waiting for MinIO connection..."
          sleep 1
        done
        mc mb --ignore-existing localminio/"$${WAREHOUSE_BUCKET}"
        echo "Bucket $${WAREHOUSE_BUCKET} ready!"
        exit 0
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      WAREHOUSE_BUCKET: ${WAREHOUSE_BUCKET}

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: enem-iceberg-rest
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: ${ICEBERG_WAREHOUSE_LOCATION}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:sqlite:/home/iceberg/iceberg_catalog.db
    ports:
      - "${ICEBERG_REST_PORT}:8181"
    volumes:
      - iceberg_data:/home/iceberg
    networks:
      - lakehouse-net
    depends_on:
      minio-init:
        condition: service_completed_successfully

  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: enem-spark:4.1.3
    pull_policy: build
    container_name: enem-spark
    environment:
      SPARK_MODE: master
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    ports:
      - "${SPARK_MASTER_PORT}:7077"
      - "${SPARK_MASTER_WEBUI_PORT}:8081"
      - "${SPARK_DRIVER_WEBUI_PORT}:4040"
    volumes:
      - ./jobs:/opt/spark/jobs
      - ./data:/opt/spark/data
    networks:
      - lakehouse-net
    depends_on:
      iceberg-rest:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  airflow:
    image: enem-airflow:3.3.2
    pull_policy: build
    build:
      context: ./airflow
      dockerfile: Dockerfile
      additional_contexts:
        spark-dist: service:spark
      args:
        AIRFLOW_BASE_IMAGE: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.3.2}
    container_name: enem-airflow
    restart: unless-stopped
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/simple_auth_manager_passwords.json"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USERNAME:-admin}:admin"
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
      AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark:7077"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./jobs:/opt/airflow/jobs
      - ./data:/opt/airflow/data
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    networks:
      - lakehouse-net
    depends_on:
      spark:
        condition: service_started
      iceberg-rest:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

volumes:
  minio_data:
  iceberg_data:

networks:
  lakehouse-net:
    driver: bridge
