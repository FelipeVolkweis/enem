# Stock single-node config, plus spill-to-disk so joins/aggregations that outgrow the small heap
# (TRINO_MEM_LIMIT) spill instead of failing with "exceeded per-node memory limit".
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}

spill-enabled=true
spiller-spill-path=/tmp/trino-spill
max-spill-per-node=20GB
query-max-spill-per-node=20GB

# Trino sizes parallelism by core count (16 scans and up to 16 Parquet writers per query here), and
# scans/writers can't spill, so on a small heap they hit the per-node query limit (30% of heap).
# Fewer threads and writers keep a query's scan and write buffers within it.
task.max-worker-threads=4
task.concurrency=4
task.min-writer-count=1
task.max-writer-count=2

# resource-groups.json runs one query at a time, so that query may use most of the heap's query pool
# (heap minus 30% headroom). Keep TRINO_MEM_LIMIT >= ~1.2g or Trino refuses to start with this value.
query.max-memory-per-node=700MB
